name: Link Check

# Catches dead links and broken cross-references in the Markdown docs.
# Runs on pushes/PRs that touch Markdown, and weekly to catch external rot.
on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments "**/*.md"
          fail: true
